name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate-skills.py
      - run: python scripts/test_review_package.py
      - name: Validate shell syntax
        shell: bash
        run: |
          scripts=(
            superpowers-brainstorming-psilon/scripts/*.sh
            superpowers-subagent-driven-development-psilon/scripts/*
            superpowers-systematic-debugging-psilon/*.sh
            dragonfly-scripting/scripts/*.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - run: git diff --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full Git history
        env:
          GITLEAKS_VERSION: 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          expected=$(awk -v asset="$asset" '$2 == asset { print $1 }' \
            "$RUNNER_TEMP/gitleaks-checksums.txt")
          actual=$(sha256sum "$RUNNER_TEMP/$asset" | awk '{ print $1 }')
          test -n "$expected"
          test "$actual" = "$expected"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --no-color --redact \
            --exit-code 1 --log-opts='--all --full-history' \
            --config .gitleaks.toml .
